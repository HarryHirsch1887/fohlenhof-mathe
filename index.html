<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sicherheit (seit 2026-10-21): Nur Dateien der App selbst, kein Netzwerkzugriff nach außen, keine Fremdquellen, Formulare, Rahmen und Plug-ins gesperrt.
     'unsafe-inline' bleibt nötig, weil die App onclick-Attribute und style-Attribute nutzt.
     'file:' steht nur da, damit die App auch per Doppelklick auf die Datei läuft (dort passt 'self' nicht). Eine Webseite darf keine lokalen Dateien laden, im Netz bewirkt es nichts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; manifest-src 'self' file:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<title>Rechenhof – Mathe mit Pferd</title>
<meta name="theme-color" content="#4f8a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechenhof">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="hof" class="hof" aria-hidden="true"></svg>
<div id="fly" hidden><button onclick="flyOff()">Landen</button><span>Wische zum Umschauen, tippe auf ein Pferd.</span></div>
<main id="app"></main>
<script src="aufgaben.js"></script>
<script src="pferd.js"></script>
<script src="hof.js"></script>
<script src="figur.js"></script>
<script src="zeichnung.js"></script>
<script src="qr.js"></script>
<script src="training.js"></script>
<script src="pflege.js"></script>
<script src="menue.js"></script>
<script src="app.js"></script>
<script>
// Offline-Nutzung: nur wenn die App über http(s) geladen wird (nicht per Doppelklick auf die Datei)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
